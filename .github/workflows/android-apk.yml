name: APK de Android

# Se ejecuta a mano desde Actions → «APK de Android» → Run workflow,
# y al publicar un tag v*. No compila en cada PR porque tarda bastante.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  apk:
    name: Compilar APK de prueba
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Proyecto final"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar la configuración de Firebase
        run: test -f lib/firebase_options.dart

      - name: Compilar APK (firma debug)
        run: flutter build apk --release

      - name: Publicar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: tasku-apk-${{ github.run_number }}
          path: "Proyecto final/build/app/outputs/flutter-apk/*.apk"
          retention-days: 30
