  
name: Formato, análisis y pruebas

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  flutter-checks:
    name: Formato, análisis y pruebas
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Proyecto final"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test

      - name: Compilar para web
        run: flutter build web --release

  flutter-checks-s15:
    name: Formato, análisis y pruebas (S15)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Proyectos aparte/Laboratorio S15"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Analizar código
        run: flutter analyze

      - name: Ejecutar pruebas
        run: flutter test
