name: Diagnóstico en emulador Android

# Temporal: instala el APK en un emulador y sube el logcat para ver por qué
# la app se cierra al abrir. Se dispara al subir cambios a esta rama.
on:
  push:
    branches:
      - android-smoke
  workflow_dispatch:

jobs:
  emulador:
    name: Instalar y capturar logcat
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Proyecto final"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Ejecutar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r "Proyecto final/build/app/outputs/flutter-apk/app-release.apk"
            adb logcat -c
            adb shell am start -n com.example.pdm2026e_equipo_05_unitasks/.MainActivity
            sleep 35
            adb shell pidof com.example.pdm2026e_equipo_05_unitasks || echo "PROCESO NO ESTA CORRIENDO"
            adb logcat -d > "Proyecto final/logcat.txt"
            adb shell screencap -p /sdcard/tasku.png || true
            adb pull /sdcard/tasku.png "Proyecto final/tasku.png" || true
            echo "=== errores relevantes ==="
            grep -E "FATAL|AndroidRuntime|flutter|Firebase|Ads|Exception" "Proyecto final/logcat.txt" | tail -200

      - name: Publicar logcat y captura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-tasku
          path: |
            Proyecto final/logcat.txt
            Proyecto final/tasku.png
          retention-days: 7
          if-no-files-found: warn
